<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
  <head></head>
  <body style="background-color:#fafafa;margin:0;padding:0">
    <!--$--><!--html--><!--body-->
    <table
      border="0"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      align="center">
      <tbody>
        <tr>
          <td
            style="margin:0;padding:24px 0;background-color:#fafafa;font-family:Arial, Helvetica, sans-serif">
            <table
              align="center"
              width="100%"
              border="0"
              cellpadding="0"
              cellspacing="0"
              role="presentation"
              style="max-width:480px;margin:0 auto">
              <tbody>
                <tr style="width:100%">
                  <td>
                    <div
                      style="background-color:#ffffff;border-radius:12px;padding:32px 28px;border:1px solid #71717a">
                      <div
                        style="width:40px;height:40px;border-radius:10px;background-color:#1b4638;margin-bottom:20px"></div>
                      <h1
                        style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#141414">

                      </h1>
                      <p
                        style="font-size:15px;line-height:1.6;margin:0 0 24px;color:#141414;margin-top:0;margin-right:0;margin-bottom:24px;margin-left:0">

                        and your squad is ready: line up your pay, payday by
                        payday.
                      </p>
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="color:#ffffff;text-decoration-line:none;display:inline-block;background-color:#1b4638;text-decoration:none;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:700"
                        target="_blank"
                        >Confirm your email</a
                      >
                      <p
                        style="font-size:12px;line-height:1.6;margin:24px 0 0;color:#71717a;margin-top:24px;margin-right:0;margin-bottom:0;margin-left:0">
                        If the button doesn&#x27;t work, copy this address into
                        your browser:<!-- -->
                        <span style="word-break:break-all"
                          >{{ .ConfirmationURL }}</span
                        >
                      </p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
