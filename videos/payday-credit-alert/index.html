<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2560px;
        height: 1080px;
        overflow: hidden;
        background: #101010;
      }
      #root {
        position: relative;
        width: 2560px;
        height: 1080px;
        overflow: hidden;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      /* global progress: the run bar belongs to the film, not to a frame,
         so it sits on the root and is never re-drawn per slot */
      #run-bar {
        position: absolute;
        bottom: 38px;
        left: 0;
        width: 100%;
        height: 4px;
        background: #f5ff6b;
        transform-origin: 0% 50%;
        transform: scaleX(0);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-d1zi"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="2560"
      data-height="1080"
    >
      <div data-hf-id="hf-29pa"
        id="el-alert"
        data-composition-id="01-alert"
        data-composition-src="compositions/frames/01-alert.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="2560"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-dcgh"
        id="el-grab"
        data-composition-id="02-grab"
        data-composition-src="compositions/frames/02-grab.html"
        data-start="4"
        data-duration="6.5"
        data-track-index="1"
        data-width="2560"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-2301"
        id="el-shape"
        data-composition-id="03-shape"
        data-composition-src="compositions/frames/03-shape.html"
        data-start="10.5"
        data-duration="6"
        data-track-index="1"
        data-width="2560"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-xzue"
        id="el-ledger"
        data-composition-id="04-ledger"
        data-composition-src="compositions/frames/04-ledger.html"
        data-start="16.5"
        data-duration="4.5"
        data-track-index="1"
        data-width="2560"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-lhg5"
        id="el-pivot"
        data-composition-id="05-pivot"
        data-composition-src="compositions/frames/05-pivot.html"
        data-start="21"
        data-duration="4.5"
        data-track-index="1"
        data-width="2560"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-ez2m"
        id="el-sting"
        data-composition-id="06-sting"
        data-composition-src="compositions/frames/06-sting.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="1"
        data-width="2560"
        data-height="1080"
      ></div>

      <!--
        Sound design. The film is built silent-first, so this is a reward layer,
        not a bed: no music, a cue only where the picture already has a hit, and
        long gaps of nothing. Every file is from the bundled offline HyperFrames
        library (HeyGen is not signed in). Root-level, track 10 — audio never
        belongs inside a frame file.
      -->
      <audio data-hf-id="hf-qxyy" id="sfx-alert" src="assets/sfx/notification.mp3" data-start="0.05" data-duration="2.46" data-track-index="10" data-volume="0.6"></audio>
      <audio data-hf-id="hf-zvs3" id="sfx-g1" src="assets/sfx/ping.mp3" data-start="4.8" data-duration="1.32" data-track-index="11" data-volume="0.45"></audio>
      <audio data-hf-id="hf-g3x4" id="sfx-g2" src="assets/sfx/ping.mp3" data-start="5.6" data-duration="1.32" data-track-index="12" data-volume="0.45"></audio>
      <audio data-hf-id="hf-lkne" id="sfx-g3" src="assets/sfx/ping.mp3" data-start="6.4" data-duration="1.32" data-track-index="13" data-volume="0.45"></audio>
      <audio data-hf-id="hf-o9bz" id="sfx-g4" src="assets/sfx/ping.mp3" data-start="7.2" data-duration="1.32" data-track-index="14" data-volume="0.45"></audio>
      <audio data-hf-id="hf-9ij8" id="sfx-g5" src="assets/sfx/ping.mp3" data-start="8" data-duration="1.32" data-track-index="15" data-volume="0.5"></audio>
      <audio data-hf-id="hf-sqgl" id="sfx-claim" src="assets/sfx/impact-bass-1.mp3" data-start="8.4" data-duration="2.12" data-track-index="16" data-volume="0.55"></audio>
      <audio data-hf-id="hf-c0jl" id="sfx-shape" src="assets/sfx/chime.mp3" data-start="14.2" data-duration="2.5" data-track-index="17" data-volume="0.55"></audio>
      <audio data-hf-id="hf-w6oc" id="sfx-sheet" src="assets/sfx/whoosh-short.mp3" data-start="16.65" data-duration="0.57" data-track-index="18" data-volume="0.4"></audio>
      <audio data-hf-id="hf-k4ch" id="sfx-zero" src="assets/sfx/ping.mp3" data-start="18.9" data-duration="1.32" data-track-index="19" data-volume="0.5"></audio>
      <audio data-hf-id="hf-awfa" id="sfx-arrow" src="assets/sfx/whoosh-short.mp3" data-start="22.2" data-duration="0.57" data-track-index="20" data-volume="0.4"></audio>
      <audio data-hf-id="hf-e7vy" id="sfx-pivot" src="assets/sfx/impact-bass-2.mp3" data-start="23.05" data-duration="2.59" data-track-index="21" data-volume="0.5"></audio>
      <audio data-hf-id="hf-cy0h" id="sfx-mark" src="assets/sfx/pop.mp3" data-start="25.6" data-duration="0.72" data-track-index="22" data-volume="0.45"></audio>
      <audio data-hf-id="hf-uvs7" id="sfx-name" src="assets/sfx/chime.mp3" data-start="27" data-duration="2.4" data-track-index="23" data-volume="0.5"></audio>

      <div data-hf-id="hf-qsnc" id="run-bar"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const root = gsap.timeline({ paused: true });

      // One linear fill across the whole 30s: progress the viewer can feel,
      // never an ease, never a repeat.
      root.fromTo(
        "#run-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 30, ease: "none" },
        0,
      );

      window.__timelines["main"] = root;
    </script>
  </body>
</html>
