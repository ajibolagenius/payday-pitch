<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
        src: url("assets/fonts/sg-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
        src: url("assets/fonts/sg-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #101010;
      }
      /* Square: both axes are 1080, so the whole ramp can live in cqw
         (1cqw = 10.8px) and every size clears the 28px reading floor.
        The hands keep the wide frame's block system — five across the bottom,
        marching on an alternating baseline — because the row still fits. */
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #101010;
        background-image:
          linear-gradient(rgba(250, 250, 250, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(250, 250, 250, 0.055) 1px, transparent 1px);
        background-size: 4.2cqw 4.2cqw;
        container-type: size;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: #fafafa;
      }
      .rule-top,
      .rule-bottom {
        position: absolute;
        left: 5cqw;
        right: 5cqw;
        height: 0.3cqw;
        background: rgba(250, 250, 250, 0.6);
      }
      .rule-top {
        top: 3.2cqw;
      }
      .rule-bottom {
        bottom: 3.2cqw;
      }
      .label {
        position: absolute;
        left: 7cqw;
        font-size: 2.7cqw;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(250, 250, 250, 0.7);
      }
      .l-credited {
        top: 12cqw;
      }
      .l-left {
        top: 19cqw;
        color: rgba(250, 250, 250, 0.6);
      }
      .amount {
        position: absolute;
        top: 26cqw;
        left: 7cqw;
        font-size: 12cqw;
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: #f5ff6b;
      }
      .claim {
        position: absolute;
        top: 44cqw;
        right: 7cqw;
        width: 46cqw;
        text-align: right;
        font-size: 6.4cqw;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.015em;
      }
      /* Five across a 1080 square clips the figures, so the band breaks into
         three over two and the second row sits in the gaps of the first. */
      .hands {
        position: absolute;
        top: 60cqw;
        left: 5cqw;
        right: 5cqw;
        display: flex;
        flex-direction: column;
        gap: 3.2cqw;
      }
      .hand-row {
        display: flex;
        justify-content: space-between;
      }
      .hand-row + .hand-row {
        padding: 0 15.5cqw;
      }
      .grab {
        width: 28cqw;
        padding: 2.4cqw 2.2cqw;
        background: #141414;
        border: 0.3cqw solid rgba(250, 250, 250, 0.18);
        border-radius: 1.6cqw;
      }
      .grab .lab {
        font-size: 2.7cqw;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(250, 250, 250, 0.7);
      }
      .grab .amt {
        margin-top: 1.4cqw;
        font-size: 4.2cqw;
        font-weight: 700;
        letter-spacing: -0.015em;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="key-graphic-square"
      data-width="1080"
      data-height="1080"
      data-duration="1"
      data-fps="30"
    >
      <div class="rule-top"></div>
      <div class="rule-bottom"></div>

      <div class="label l-credited">Credited · 10 Oct · 09:41 · Salary</div>
      <div class="label l-left">Left by the 20th</div>
      <div class="amount">₦355,000</div>

      <div class="claim">Every naira has a&nbsp;position.</div>

      <div class="hands">
        <div class="hand-row">
          <div class="grab"><div class="lab">Rent</div><div class="amt">₦450,000</div></div>
          <div class="grab"><div class="lab">Debt</div><div class="amt">₦180,000</div></div>
          <div class="grab"><div class="lab">Family</div><div class="amt">₦150,000</div></div>
        </div>
        <div class="hand-row">
          <div class="grab"><div class="lab">Friday</div><div class="amt">₦80,000</div></div>
          <div class="grab"><div class="lab">Data</div><div class="amt">₦25,000</div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["key-graphic-square"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
