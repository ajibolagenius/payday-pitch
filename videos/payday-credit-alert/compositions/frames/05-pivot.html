      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const FIELD_W = 1.117 * 1080;
        const FIELD_H = 0.84 * 1080;

        // depth-scatter-assemble, flattened: every shirt parks at its 4-4-2 slot
        // at t=0, so the cut from frame 04 is a continuation, then travels home.
        const TRAVEL_AT = 0.45;
        const TRAVEL_DUR = 1.1;
        const STAGGER = 0.05;
        Array.from(document.querySelectorAll("[data-from]")).forEach((el, i) => {
          const [fromX, fromY] = el.dataset.from.split(",").map(Number);
          const toX = parseFloat(el.style.left);
          const toY = parseFloat(el.style.top);
          const dx = (fromX - toX) / 100 * FIELD_W;
          const dy = (fromY - toY) / 100 * FIELD_H;
          if (dx === 0 && dy === 0) return;
          tl.fromTo(
            el,
            { x: dx, y: dy },
            { x: 0, y: 0, duration: TRAVEL_DUR, ease: "power3.out" },
            TRAVEL_AT + i * STAGGER,
          );
        });

        // press-release-spring — the tag arrives already pressed, then releases.
        tl.fromTo(
          "#f5-callout",
          { scale: 0.92, opacity: 0 },
          { scale: 0.92, opacity: 1, duration: 0.18, ease: "power1.out" },
          0.15,
        );
        tl.to("#f5-callout", { scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 0.38);
        tl.fromTo(
          "#f5-burst",
          { scale: 1, opacity: 0.7 },
          { scale: 1.12, opacity: 0, duration: 0.5, ease: "power2.out" },
          0.4,
        );

        // svg-path-draw, then the clean pen line settles into chalk dashes.
        const pens = Array.from(document.querySelectorAll(".f5-draw"));
        pens.forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });
        const ARROW_AT = 1.2;
        pens.forEach((p, i) => {
          tl.to(
            p,
            { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
            ARROW_AT + i * 0.35,
          );
        });
        tl.to("#f5-run-solid", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 2.3);
        tl.to(
          "#f5-run-dashed",
          { opacity: 1, duration: 0.3, ease: "power1.inOut" },
          2.3,
        );

        // the read moves from the keeper to the debt-paying midfielder.
        tl.to("#f5-n7", { color: "#f5ff6b", duration: 0.4, ease: "power1.out" }, 2.2);
        tl.fromTo(
          "#f5-ring",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" },
          2.2,
        );

        window.__timelines["05-pivot"] = tl;
      </script>
