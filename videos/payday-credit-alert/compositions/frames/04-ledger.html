      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // titlecard-reveal: the frame gets exactly one move — the sheet rises —
        // then the three lines land inside it and nothing else ever animates.
        tl.fromTo(
          "#f4-sheet",
          { y: 60, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
          0.15,
        );

        // dynamic-content-sequencing — one row per ~0.6s, power3 tails, then hold.
        ["#f4-r0", "#f4-r1", "#f4-r2"].forEach((sel, i) => {
          tl.fromTo(
            sel,
            { y: 18, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            0.7 + i * 0.6,
          );
        });

        window.__timelines["04-ledger"] = tl;
