          top of the defence line at this aspect, and the whole point of the
          wide frame is that the readout has somewhere to live.

        .bench {

          top: 54cqh;

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Field box in px at 2560x1080 — 111.7cqh x 84cqh, the app's 133:100.
        const FIELD_W = 1.117 * 1080;
        const FIELD_H = 0.84 * 1080;

        // svg-path-draw — measure real geometry, dash to it, animate offset to 0.
        // Pens don't bounce: power2.out only, never back.out / elastic.out.
        const draws = Array.from(document.querySelectorAll(".f3-draw"));
        draws.forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });

        tl.fromTo(
          "#f3-grass .grass",
          { fillOpacity: 0 },
          { fillOpacity: 1, duration: 0.5, ease: "power1.out", stagger: 0.008 },
          0,
        );

        const DRAW_DUR = 0.6;
        const SEG_STAGGER = 0.22;
        draws.forEach((p, i) => {
          tl.to(
            p,
            { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" },
            0.05 + i * SEG_STAGGER,
          );
        });
        const LAST_DRAW_END = 0.05 + (draws.length - 1) * SEG_STAGGER + DRAW_DUR;

        tl.fromTo(
          "#f3-detail",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" },
          LAST_DRAW_END - 0.25,
        );

        tl.fromTo(
          "#f3-head",
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
          0.4,
        );
        tl.fromTo(
          "#f3-line",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
          0.7,
        );

        // center-outward-expansion — every shirt starts at the centre spot and
        // travels to its real coordinate. Transforms only; left/top stay put.
        const NODE_AT = 1.7;
        const EXPAND_DUR = 1.4;
        const STAGGER = Math.min(0.06, 0.5 / 11);
        const nodes = Array.from(document.querySelectorAll("[data-x]"));
        nodes.forEach((el, i) => {
          const dx = (50 - Number(el.dataset.x)) / 100 * FIELD_W;
          const dy = (50 - Number(el.dataset.y)) / 100 * FIELD_H;
          tl.fromTo(
            el,
            { x: dx, y: dy, scale: 0.5, opacity: 0 },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
            NODE_AT + i * STAGGER,
          );
        });

        // The two named slots land after the eleven: the keeper's role first,
        // then the bench joke.
        tl.fromTo(
          "#f3-bench",
          { y: 16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
          3.25,
        );
        tl.fromTo(
          "#f3-gklabel",
          { opacity: 0 },
          { opacity: 1, duration: 0.45, ease: "power1.out" },
          3.4,
        );
        // y + opacity, not scale: a scaling disc puts the shirt number under
        // the reading floor for a few frames, and the checker is right that
        // nobody can read it.
        tl.fromTo(
          "#f3-gknode",
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          3.5,
        );
        tl.fromTo(
          "#f3-bench-node",
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          3.75,
        );

        window.__timelines["03-shape"] = tl;
      </script>
