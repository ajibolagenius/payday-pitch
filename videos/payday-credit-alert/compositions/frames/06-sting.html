      <style>
        @font-face {
          font-family: "Space Grotesk";
          font-style: normal;

          src: url("assets/fonts/sg-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
            U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
            U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Space Grotesk";
          font-style: normal;
          font-weight: 300 700;
          font-display: block;
          src: url("assets/fonts/sg-latin-ext.woff2") format("woff2");
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
            U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
            U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        #root {
          position: absolute;
          inset: 0;
          background-color: #101010;
          background-image:
            linear-gradient(rgba(250, 250, 250, 0.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(250, 250, 250, 0.055) 1px, transparent 1px);
          background-size: 2cqw 2cqw;
          container-type: size;
          font-family: "Space Grotesk", system-ui, sans-serif;
          color: #fafafa;
          overflow: hidden;
        }
        .rule-top {
          position: absolute;
          top: 1.7cqh;
          left: 3.2cqw;
          right: 3.2cqw;
          height: 0.14cqw;
          background: rgba(250, 250, 250, 0.6);
        }
        .rule-bottom {
          position: absolute;
          bottom: 1.7cqh;
          left: 3.2cqw;
          right: 3.2cqw;
          height: 0.14cqw;
          background: rgba(250, 250, 250, 0.6);
        }
        /* ultrawide: the lockup is one horizontal group, not a stacked card.
           The mark holds the left, the words sit beside it, aligned centre. */
        .lockup {
          position: absolute;
          top: 29cqh;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 5cqw;
        }
        /* the app's own mark: public/icons/master.svg, drawn rather than pasted */
        .mark {
          display: block;
          flex: 0 0 auto;
          width: 42cqh;
          height: 42cqh;
          will-change: transform;
        }
        .mark-plate {
          fill: #1b4638;
        }
        .mark-line {
          fill: none;
          stroke: #f5ff6b;
          stroke-width: 20;
          stroke-linecap: round;
        }
        .mark-shape {
          fill: #f5ff6b;
          stroke: none;
          fill-opacity: 0;
        }
        .words {
          flex: 0 0 auto;
        }
        .wordmark {
          font-size: 14cqh;
          font-weight: 700;
          line-height: 1;
          letter-spacing: -0.02em;
          will-change: transform;
        }
        .cta {
          margin-top: 2.4cqh;
          font-size: 6.5cqh;
          font-weight: 700;
          line-height: 1.05;
          color: #f5ff6b;
          letter-spacing: -0.015em;
          will-change: transform;
        }
        .trust {
          margin-top: 4cqh;
          font-size: 2.8cqh;
          font-weight: 500;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: rgba(250, 250, 250, 0.7);
        }
        /* the cut from the pitch arrives through the ground colour */
        .dip {
          position: absolute;
          inset: 0;
          z-index: 3;
          background-color: #101010;
          background-image:
            linear-gradient(rgba(250, 250, 250, 0.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(250, 250, 250, 0.055) 1px, transparent 1px);
          background-size: 2cqw 2cqw;
        }
      </style>

      <div data-hf-id="hf-isio"
        id="root"
        data-composition-id="06-sting"
        data-width="2560"
        data-height="1080"
      >
        <div data-hf-id="hf-is4o" class="rule-top"></div>
        <div data-hf-id="hf-sm62" class="rule-bottom"></div>

        <div data-hf-id="hf-6jvi" class="lockup">
          <svg data-hf-id="hf-u8re" class="mark" id="f6-mark" viewBox="0 0 512 512" aria-hidden="true">
            <rect data-hf-id="hf-17b7" class="mark-plate" width="512" height="512" rx="112" />
            <circle data-hf-id="hf-xzan" class="mark-line f6-draw" id="f6-ring" cx="256" cy="252" r="138" />
            <path data-hf-id="hf-ugal" class="mark-shape" id="f6-shape" d="M256 206 220 232 234 274h44l14-42Z" />
            <path data-hf-id="hf-g0xu" class="mark-line f6-draw" d="M256 206v-92" />
            <path data-hf-id="hf-xc1l" class="mark-line f6-draw" d="M220 232l-74-28" />
            <path data-hf-id="hf-ddan" class="mark-line f6-draw" d="M234 274l-44 74" />
            <path data-hf-id="hf-zri6" class="mark-line f6-draw" d="M278 274l44 74" />
            <path data-hf-id="hf-89j1" class="mark-line f6-draw" d="M292 232l74-28" />
          </svg>

          <div data-hf-id="hf-m60b" class="words">
            <div data-hf-id="hf-3s5o" class="wordmark" id="f6-word">Payday Pitch</div>
            <div data-hf-id="hf-3z5y" class="cta" id="f6-cta">Line up your next payday.</div>
            <div data-hf-id="hf-rsjp" class="trust" id="f6-trust">Plans only · Never moves your money</div>
          </div>
        </div>

        <div data-hf-id="hf-mkd5" class="dip" id="f6-dip"></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#f6-dip",
          { opacity: 1 },
          { opacity: 0, duration: 0.45, ease: "power1.inOut" },
          0,
        );

        // svg-path-draw — measure each pen, dash to its own length.
        const ring = document.getElementById("f6-ring");
        const spokes = Array.from(document.querySelectorAll(".f6-draw")).filter(
          (p) => p !== ring,
        );
        const dash = (p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
          return len;
        };
        dash(ring);
        spokes.forEach(dash);

        tl.fromTo(
          "#f6-mark",
          { scale: 0.94, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.1,
        );
        tl.to(ring, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.3);
        tl.fromTo(
          "#f6-shape",
          { fillOpacity: 0 },
          { fillOpacity: 1, duration: 0.35, ease: "power1.out" },
          0.95,
        );
        // the five spokes shoot out last: one shape, then it is pushed to positions.
        spokes.forEach((p, i) => {
          tl.to(
            p,
            { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
            1.1 + i * 0.09,
          );
        });

        // Closing lines each need 2 s+ of screen time, so the sequence starts
        // as soon as the mark has drawn and the last hold is 1.8 s.
        tl.fromTo(
          "#f6-word",
          { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          1.35,
        );
        tl.fromTo(
          "#f6-cta",
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          1.85,
        );
        tl.fromTo(
          "#f6-trust",
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power1.out" },
          2.2,
        );

        window.__timelines["06-sting"] = tl;
      </script>
    </template>
  </body>
</html>
